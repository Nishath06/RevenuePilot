version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revenuepilot_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://host.docker.internal:27017
      - ENVIRONMENT=production
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: revenuepilot_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
