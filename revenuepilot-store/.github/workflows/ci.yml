name: RevenuePilot Store CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Lint, Test & Verification
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: revenuepilot-store/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r revenuepilot-store/backend/requirements.txt

      - name: Run Backend Tests
        env:
          MONGODB_URL: mongodb://localhost:27017
          DATABASE_NAME: revenuepilot_store_test
          RAZORPAY_KEY_ID: rzp_test_revenuepilot_key_123
          RAZORPAY_KEY_SECRET: rzp_test_secret_456
          RAZORPAY_WEBHOOK_SECRET: rzp_test_webhook_secret_789
        run: |
          cd revenuepilot-store/backend
          pytest ../tests -v

  frontend-ci:
    name: Frontend Dependencies & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: revenuepilot-store/frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd revenuepilot-store/frontend
          npm ci

      - name: Build Frontend Production Asset
        run: |
          cd revenuepilot-store/frontend
          npm run build

  docker-ci:
    name: Docker Containers Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: revenuepilot-store/backend
          file: revenuepilot-store/backend/Dockerfile
          push: false
          tags: revenuepilot-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: revenuepilot-store/frontend
          file: revenuepilot-store/frontend/Dockerfile
          push: false
          tags: revenuepilot-frontend:ci
