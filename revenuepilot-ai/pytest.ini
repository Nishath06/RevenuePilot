[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Fast unit tests (no external services)
    integration: Requires external services (DB, LLM, AWS, etc.)
    aws: Requires AWS credentials and connectivity
    llm: Requires OpenAI / Gemini / Grok API keys
    razorpay: Requires Razorpay credentials
