# =============================================================================
# Trivy Configuration — RevenuePilot
#
# POLICY:
#   - Python application package CVEs: ENFORCED (HIGH + CRITICAL, fail pipeline)
#   - pip-vendored internal packages: IGNORED via .trivyignore
#     (pip bundles msgpack/setuptools internally — these are NOT app dependencies)
#   - OS/Debian unfixed CVEs: SUPPRESSED (no upstream patch available)
#   - All FIXED OS CVEs: ENFORCED
# =============================================================================

scan:
  scanners:
    - vuln

format: table
severity:
  - HIGH
  - CRITICAL

vulnerability:
  ignore-unfixed: true
  type:
    - os
    - library

# .trivyignore suppresses false positives from pip's internally vendored packages
ignorefile: .trivyignore

exit-code: 1
