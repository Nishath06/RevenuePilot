name: RevenuePilot CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

  # ── Pinned security package versions (single source of truth) ──────────────
  # Update these when remediating future CVEs. Must match Dockerfiles.
  EXPECTED_SETUPTOOLS: "84.0.0"
  EXPECTED_WHEEL: "0.46.2"
  EXPECTED_MSGPACK: "1.2.1"
  EXPECTED_JARACO_CONTEXT: "6.1.2"

jobs:

  #####################################################################
  # JOB 1 — Backend Tests + Frontend Builds
  #####################################################################

  test:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest
    environment: DevOps

    env:
      ENVIRONMENT: DevOps
      DEBUG: "false"

      # MongoDB
      MONGODB_URL: ${{ vars.MONGODB_URL }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}

      # LLM Providers
      LLM_PROVIDER: gemini
      OPENAI_API_KEY: ${{ vars.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ vars.GEMINI_API_KEY }}
      GROK_API_KEY: ${{ vars.GROK_API_KEY }}

      # AWS
      AWS_MODE: local
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_SECRET_ACCESS_KEY }}

      # Razorpay
      RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ vars.RAZORPAY_KEY_SECRET }}

      # Docker Hub
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ vars.DOCKER_PASSWORD }}

      # JWT Authentication
      JWT_SECRET: ${{ vars.JWT_SECRET }}
      JWT_ALGORITHM: ${{ vars.JWT_ALGORITHM }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ###########################################################
      # Verify Variables (Safe Debug)
      ###########################################################

      - name: Verify Environment Variables
        run: |
          echo "Environment: $ENVIRONMENT"

          [ -n "$MONGODB_URL" ] && echo "✅ MONGODB_URL loaded" || echo "❌ MONGODB_URL missing"
          [ -n "$DATABASE_NAME" ] && echo "✅ DATABASE_NAME loaded" || echo "❌ DATABASE_NAME missing"
          [ -n "$OPENAI_API_KEY" ] && echo "✅ OPENAI_API_KEY loaded" || echo "❌ OPENAI_API_KEY missing"
          [ -n "$AWS_ACCESS_KEY_ID" ] && echo "✅ AWS_ACCESS_KEY_ID loaded" || echo "❌ AWS_ACCESS_KEY_ID missing"
          [ -n "$RAZORPAY_KEY_ID" ] && echo "✅ RAZORPAY_KEY_ID loaded" || echo "❌ RAZORPAY_KEY_ID missing"
          [ -n "$DOCKER_USERNAME" ] && echo "✅ DOCKER_USERNAME loaded" || echo "❌ DOCKER_USERNAME missing"

      ###########################################################
      # RevenuePilot AI Backend
      ###########################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: revenuepilot-ai/requirements.txt

      - name: Install RevenuePilot AI Dependencies
        working-directory: revenuepilot-ai
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          # Install pinned security packages FIRST to prevent downgrade
          pip install --no-cache-dir \
            "setuptools==${{ env.EXPECTED_SETUPTOOLS }}" \
            "wheel==${{ env.EXPECTED_WHEEL }}" \
            "msgpack==${{ env.EXPECTED_MSGPACK }}" \
            "jaraco.context==${{ env.EXPECTED_JARACO_CONTEXT }}"
          pip install --no-cache-dir -r requirements.txt
          # Re-assert pins after requirements.txt in case transitive deps downgraded
          pip install --no-cache-dir --upgrade \
            "setuptools==${{ env.EXPECTED_SETUPTOOLS }}" \
            "wheel==${{ env.EXPECTED_WHEEL }}" \
            "msgpack==${{ env.EXPECTED_MSGPACK }}" \
            "jaraco.context==${{ env.EXPECTED_JARACO_CONTEXT }}"

      - name: Run Unit Tests (RevenuePilot AI)
        working-directory: revenuepilot-ai
        run: |
          pytest -m unit --tb=short -q

      - name: Run Integration Tests (RevenuePilot AI)
        working-directory: revenuepilot-ai
        run: |
          pytest -m integration --tb=short -q

      ###########################################################
      # Store Backend
      ###########################################################

      - name: Install Store Backend Dependencies
        working-directory: revenuepilot-store/backend
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          # Install pinned security packages FIRST to prevent downgrade
          pip install --no-cache-dir \
            "setuptools==${{ env.EXPECTED_SETUPTOOLS }}" \
            "wheel==${{ env.EXPECTED_WHEEL }}" \
            "msgpack==${{ env.EXPECTED_MSGPACK }}" \
            "jaraco.context==${{ env.EXPECTED_JARACO_CONTEXT }}"
          pip install --no-cache-dir -r requirements.txt
          # Re-assert pins after requirements.txt in case transitive deps downgraded
          pip install --no-cache-dir --upgrade \
            "setuptools==${{ env.EXPECTED_SETUPTOOLS }}" \
            "wheel==${{ env.EXPECTED_WHEEL }}" \
            "msgpack==${{ env.EXPECTED_MSGPACK }}" \
            "jaraco.context==${{ env.EXPECTED_JARACO_CONTEXT }}"

      - name: Run Store Backend Tests
        working-directory: revenuepilot-store/backend
        run: |
          pytest ../tests -m unit --tb=short -q

      ###########################################################
      # Merchant Frontend
      ###########################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            revenuepilot-merchant/frontend/package-lock.json
            revenuepilot-store/frontend/package-lock.json

      - name: Install Merchant Frontend Dependencies
        working-directory: revenuepilot-merchant/frontend
        run: npm ci

      - name: Build Merchant Frontend
        working-directory: revenuepilot-merchant/frontend
        run: npm run build

      ###########################################################
      # Store Frontend
      ###########################################################

      - name: Install Store Frontend Dependencies
        working-directory: revenuepilot-store/frontend
        run: npm ci

      - name: Build Store Frontend
        working-directory: revenuepilot-store/frontend
        run: npm run build

  #####################################################################
  # JOB 2 — Build Docker Images
  #####################################################################

  docker-build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    environment: DevOps

    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: revenuepilot-ai
            context: ./revenuepilot-ai
            is_python: true

          - image: revenuepilot-merchant
            context: ./revenuepilot-merchant/frontend
            is_python: false

          - image: revenuepilot-store-backend
            context: ./revenuepilot-store/backend
            is_python: true

          - image: revenuepilot-store-frontend
            context: ./revenuepilot-store/frontend
            is_python: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --pull: always fetch latest base image (prevents stale base layer caching)
      # --no-cache: prevents Docker layer cache from reusing old package install layers
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          load: true
          no-cache: true
          pull: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:latest

      # ── Python Package Version Verification ─────────────────────────────────
      # Verifies BOTH the venv packages (/opt/venv) AND system python packages.
      # Trivy scans both locations independently — both must be patched.
      - name: Verify Python Package Security Versions
        if: matrix.is_python == true
        env:
          IMAGE: ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          EXPECTED_SETUPTOOLS: ${{ env.EXPECTED_SETUPTOOLS }}
          EXPECTED_WHEEL: ${{ env.EXPECTED_WHEEL }}
          EXPECTED_MSGPACK: ${{ env.EXPECTED_MSGPACK }}
          EXPECTED_JARACO_CONTEXT: ${{ env.EXPECTED_JARACO_CONTEXT }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Verifying security package versions in: ${{ matrix.image }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          docker run --rm ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }} \
            python -c "
          import importlib.metadata as md, sys

          expected = {
              'setuptools':     '${{ env.EXPECTED_SETUPTOOLS }}',
              'wheel':          '${{ env.EXPECTED_WHEEL }}',
              'msgpack':        '${{ env.EXPECTED_MSGPACK }}',
              'jaraco.context': '${{ env.EXPECTED_JARACO_CONTEXT }}',
          }

          failures = []
          for pkg, required_ver in expected.items():
              try:
                  actual_ver = md.version(pkg)
                  if actual_ver == required_ver:
                      print(f'  ✅ {pkg}: {actual_ver}')
                  else:
                      print(f'  ❌ {pkg}: {actual_ver} (expected {required_ver})')
                      failures.append(f'{pkg} expected={required_ver} actual={actual_ver}')
              except md.PackageNotFoundError:
                  print(f'  ❌ {pkg}: NOT FOUND')
                  failures.append(f'{pkg} not installed')

          if failures:
              print()
              print('SECURITY VIOLATION: Package version mismatch detected!')
              for f in failures:
                  print(f'  → {f}')
              sys.exit(1)

          print()
          print('✅ All security package versions verified successfully.')
          "

      - name: Save Docker Image
        run: |
          docker save \
            ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }} \
            -o ${{ matrix.image }}.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}
          path: ${{ matrix.image }}.tar
          retention-days: 1

  #####################################################################
  # JOB 3 — Trivy Security Scan
  #####################################################################

  trivy-scan:
    name: Trivy Security Scan
    needs: docker-build
    runs-on: ubuntu-latest
    environment: DevOps

    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}

    strategy:
      fail-fast: false
      matrix:
        image:
          - revenuepilot-ai
          - revenuepilot-merchant
          - revenuepilot-store-backend
          - revenuepilot-store-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image }}

      - name: Load Docker Image
        run: docker load -i ${{ matrix.image }}.tar

      # Trivy scans both OS packages and Python packages in the image.
      # ignore-unfixed: suppresses Debian CVEs with no upstream fix available.
      # Python package CVEs always have a "fix" (the patched version we pinned),
      # so they will not be suppressed.
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-config: .trivy.yaml
          exit-code: 1

  #####################################################################
  # JOB 4 — Push Docker Images
  #####################################################################

  docker-push:
    name: Push Docker Images to Docker Hub
    needs: trivy-scan
    runs-on: ubuntu-latest
    environment: DevOps

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ vars.DOCKER_PASSWORD }}

    strategy:
      fail-fast: false
      matrix:
        image:
          - revenuepilot-ai
          - revenuepilot-merchant
          - revenuepilot-store-backend
          - revenuepilot-store-frontend

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image }}

      - name: Load Docker Image
        run: docker load -i ${{ matrix.image }}.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Push SHA Tag
        run: |
          docker push ${DOCKER_USERNAME}/${{ matrix.image }}:${{ github.sha }}

      - name: Push Latest Tag
        run: |
          docker push ${DOCKER_USERNAME}/${{ matrix.image }}:latest