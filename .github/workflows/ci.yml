name: RevenuePilot CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:

  #############################################################
  # JOB 1 — Backend Tests + Frontend Builds
  #############################################################

  test:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest

    # No redis service — Redis is not used in this project.
    # MongoDB is available locally for CI fallback when secrets are unavailable.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      # ── App ──────────────────────────────────────────────────
      ENVIRONMENT: test
      DEBUG: "false"

      # ── MongoDB Atlas ─────────────────────────────────────────
      MONGODB_URL: ${{ secrets.MONGODB_URL || 'mongodb://localhost:27017' }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME || 'revenuepilot_test' }}

      # ── JWT / Auth ────────────────────────────────────────────
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ALGORITHM: HS256

      # ── LLM Providers ────────────────────────────────────────
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # ── AWS ───────────────────────────────────────────────────
      AWS_MODE: local                            # unit tests never touch real AWS
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # ── Razorpay ──────────────────────────────────────────────
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ###########################################################
      # RevenuePilot AI — Python Backend
      ###########################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: revenuepilot-ai/requirements.txt

      - name: Install RevenuePilot AI Dependencies
        working-directory: revenuepilot-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests (RevenuePilot AI)
        working-directory: revenuepilot-ai
        run: |
          pytest -m unit --tb=short -q

      - name: Run Integration Tests (RevenuePilot AI)
        working-directory: revenuepilot-ai
        run: |
          pytest -m integration --tb=short -q
        # Integration tests need real secrets — skip gracefully if not available
        continue-on-error: false

      ###########################################################
      # RevenuePilot Store — Python Backend
      ###########################################################

      - name: Install Store Backend Dependencies
        working-directory: revenuepilot-store/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Store Backend Tests (unit only)
        working-directory: revenuepilot-store/backend
        run: |
          pytest -m unit --tb=short -q ../tests

      ###########################################################
      # Merchant Frontend (React + Vite)
      ###########################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: revenuepilot-merchant/frontend/package-lock.json

      - name: Install Merchant Frontend Dependencies
        working-directory: revenuepilot-merchant/frontend
        run: npm ci

      - name: Build Merchant Frontend
        working-directory: revenuepilot-merchant/frontend
        run: npm run build

      ###########################################################
      # Store Frontend (React + Vite)
      ###########################################################

      - name: Install Store Frontend Dependencies
        working-directory: revenuepilot-store/frontend
        run: npm ci
        # Uses its own lockfile — Node cache set to merchant lockfile above
        # is for the install step caching, npm ci here reads its own package-lock

      - name: Build Store Frontend
        working-directory: revenuepilot-store/frontend
        run: npm run build

  #############################################################
  # JOB 2 — Build Docker Images
  # Runs in parallel matrix after tests pass
  #############################################################

  docker-build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: revenuepilot-ai
            context: ./revenuepilot-ai

          - image: revenuepilot-merchant
            context: ./revenuepilot-merchant/frontend

          - image: revenuepilot-store-backend
            context: ./revenuepilot-store/backend

          - image: revenuepilot-store-frontend
            context: ./revenuepilot-store/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image — ${{ matrix.image }}
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest \
            ${{ matrix.context }}

      - name: Save Docker Image Artifact
        run: |
          docker save \
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }} \
            -o ${{ matrix.image }}.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}
          path: ${{ matrix.image }}.tar
          retention-days: 1

  #############################################################
  # JOB 3 — Trivy Security Scan
  #############################################################

  trivy-scan:
    name: Security Scan (Trivy)
    needs: docker-build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - revenuepilot-ai
          - revenuepilot-merchant
          - revenuepilot-store-backend
          - revenuepilot-store-frontend

    steps:
      - name: Download Docker Image — ${{ matrix.image }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image }}

      - name: Load Docker Image
        run: docker load -i ${{ matrix.image }}.tar

      - name: Run Trivy Scan — ${{ matrix.image }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  #############################################################
  # JOB 4 — Push Images to Docker Hub
  # Only runs on push to main after Trivy passes
  #############################################################

  docker-push:
    name: Push Images to Docker Hub
    needs: trivy-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - revenuepilot-ai
          - revenuepilot-merchant
          - revenuepilot-store-backend
          - revenuepilot-store-frontend

    steps:
      - name: Download Docker Image — ${{ matrix.image }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.image }}

      - name: Load Docker Image
        run: docker load -i ${{ matrix.image }}.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push SHA Tag
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

      - name: Push Latest Tag
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest